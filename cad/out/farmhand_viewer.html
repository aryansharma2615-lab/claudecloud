<title>FarmHand rail-SCARA v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#eef1ec; --panel:#ffffff; --sunk:#e3e7e0; --stage:#dfe4de;
  --ink:#141a19; --body:#33403c; --mut:#6d7a74; --line:#cdd5cd;
  --wet:#0b7d72; --dry:#9a6f05; --hot:#a8382b; --ok:#2f7d3f; --shell:#8e9a93;
  --f-disp:'Archivo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1211; --panel:#141b19; --sunk:#0a0f0e; --stage:#0a0f0e;
  --ink:#e8efea; --body:#bcc9c2; --mut:#7f8f87; --line:#25302c;
  --wet:#3fc4b2; --dry:#e0aa2e; --hot:#e87466; --ok:#59c477; --shell:#5d6a63;
}}
:root[data-theme="dark"]{
  --ground:#0d1211; --panel:#141b19; --sunk:#0a0f0e; --stage:#0a0f0e;
  --ink:#e8efea; --body:#bcc9c2; --mut:#7f8f87; --line:#25302c;
  --wet:#3fc4b2; --dry:#e0aa2e; --hot:#e87466; --ok:#59c477; --shell:#5d6a63;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--body);
  font-family:var(--f-disp);font-size:15px;line-height:1.5;overflow:hidden;
  -webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100dvh;max-width:1400px;margin:0 auto}

/* ---------- header ---------- */
header{display:flex;align-items:baseline;gap:12px;padding:12px 16px 10px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;font-weight:700;color:var(--ink);margin:0;letter-spacing:-.01em}
header .sub{font-family:var(--f-mono);font-size:11px;color:var(--mut);letter-spacing:.04em}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--mut);
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.seg button+button{border-left:1px solid var(--line)}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:270px;background:var(--stage);
  border-bottom:1px solid var(--line);touch-action:none;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:12px;top:12px;font-family:var(--f-mono);font-size:11px;
  color:var(--mut);pointer-events:none;line-height:1.7}
#hint b{color:var(--ink);font-weight:600}
#sel{position:absolute;left:12px;bottom:12px;right:12px;pointer-events:none;
  display:flex;flex-direction:column;gap:3px}
#sel .nm{font-size:18px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
#sel .nt{font-size:13px;color:var(--body);max-width:56ch;
  background:color-mix(in srgb, var(--panel) 82%, transparent);
  padding:6px 9px;border-left:2px solid var(--dry);border-radius:0 3px 3px 0}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#leads{position:absolute;inset:0;pointer-events:none}
#leads line{stroke:var(--mut);stroke-width:1;opacity:.55}
#leads line.hi{stroke:var(--dry);opacity:1;stroke-width:1.5}
.pin{position:absolute;top:0;left:0;white-space:nowrap;
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;
  background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-left-width:3px;
  padding:2px 6px;border-radius:3px;will-change:transform}
.pin.r{border-left-width:1px;border-right-width:3px}
.pin.hi{border-color:var(--dry);font-weight:600}
#tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.tbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--mut);
  font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 9px;border-radius:5px;cursor:pointer;white-space:nowrap}
.tbtn[aria-pressed="true"]{background:var(--dry);color:var(--panel);border-color:var(--dry);font-weight:600}

/* ---------- controls ---------- */
#ctl{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);
  background:var(--panel);flex-wrap:wrap}
#ctl label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--mut);white-space:nowrap}
input[type=range]{flex:1;min-width:130px;accent-color:var(--dry);height:22px}
#ctl .val{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);
  font-variant-numeric:tabular-nums;min-width:40px;text-align:right}

/* ---------- lower panel ---------- */
#panel{flex:0 0 auto;max-height:42dvh;overflow-y:auto;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.grp{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--mut);padding:11px 16px 5px;position:sticky;top:0;background:var(--panel);z-index:1}
.row{display:flex;align-items:center;gap:10px;padding:7px 16px;cursor:pointer;
  border-left:3px solid transparent}
.row:hover{background:var(--sunk)}
.row[aria-selected="true"]{background:var(--sunk);border-left-color:var(--dry)}
.row .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto;
  border:1px solid color-mix(in srgb, var(--ink) 22%, transparent)}
.row .lb{font-size:14px;color:var(--ink);font-weight:500}
.row .st{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--mut)}
.row.hid .lb{opacity:.4;text-decoration:line-through}
.row .eyeb{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.06em;border-radius:4px;
  padding:2px 6px;cursor:pointer;flex:0 0 auto}
.row .eyeb[aria-pressed="true"]{background:var(--hot);color:var(--panel);border-color:var(--hot)}
.grp{display:flex;align-items:center;gap:8px}
.grp .gb{appearance:none;border:1px solid var(--line);background:transparent;color:var(--mut);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;border-radius:4px;
  padding:1px 6px;cursor:pointer;margin-left:auto;text-transform:none}
#stat{margin-left:2px;color:var(--dry)}
.row .eye{font-family:var(--f-mono);font-size:10px;color:var(--mut);
  border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* ---------- step mode ---------- */
#steps{padding:14px 16px 20px;display:none}
#steps.on{display:block}
#steps .no{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--dry);
  text-transform:uppercase;font-weight:600}
#steps h2{font-family:var(--f-disp);font-size:21px;font-weight:700;color:var(--ink);
  margin:4px 0 7px;letter-spacing:-.015em}
#steps p{margin:0 0 14px;font-size:15px;max-width:62ch}
#steps .nav{display:flex;gap:8px;align-items:center}
#steps .nav button{appearance:none;border:1px solid var(--line);background:var(--panel);
  color:var(--ink);font-family:var(--f-disp);font-size:14px;font-weight:600;
  padding:9px 18px;border-radius:6px;cursor:pointer}
#steps .nav button:disabled{opacity:.35;cursor:default}
#steps .nav .cnt{font-family:var(--f-mono);font-size:11.5px;color:var(--mut);margin-left:auto}
#list.off{display:none}
button:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--dry);outline-offset:2px}
@media (max-width:620px){
  header .sub{display:none}
  #hint{display:none}
  #tools{right:auto;left:8px;top:auto;bottom:8px;flex-direction:row;flex-wrap:wrap;gap:5px;
    max-width:calc(100% - 16px)}
  .tbtn{padding:7px 8px;font-size:10px}
  .pin{font-size:9.5px;padding:2px 4px}
  #sel{bottom:46px}
  #sel .nm{font-size:15px}
  #panel{max-height:38dvh}
}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-mono);font-size:12px;color:var(--mut);background:var(--stage)}
</style>

<div id="app">
  <header>
    <h1>FarmHand rail-SCARA v1</h1>
    <span class="sub">posed mid plate-swap inside the H2S · 1:2 scale · tap a part</span>
    <span class="sub" id="stat"></span>
    <span class="sp"></span>
    <div class="seg" role="group" aria-label="Mode" id="modeSeg">
      <button id="mFree" aria-pressed="true">Explore</button>
      <button id="mStep" aria-pressed="false">Build steps</button>
    </div>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="load">decoding geometry…</div>
    <div id="hint"><b>drag</b> spin · <b>pinch/wheel</b> zoom · <b>tap</b> identify · <b>shift-tap</b> multi-select</div>
    <div id="tools">
      <button class="tbtn" id="bMulti" aria-pressed="false" title="Tap several parts in a row">Multi&nbsp;+</button>
      <button class="tbtn" id="bIso" aria-pressed="false">Isolate</button>
      <button class="tbtn" id="bHide">Hide</button>
      <button class="tbtn" id="bGhost" aria-pressed="true" title="Show hidden parts as faint ghosts">Ghost</button>
      <button class="tbtn" id="bLab" aria-pressed="true">Labels</button>
      <button class="tbtn" id="bShowAll">Show all</button>
      <button class="tbtn" id="bReset">Reset view</button>
    </div>
    <svg id="leads" aria-hidden="true"></svg>
    <div id="labels"></div>
    <div id="sel"><div class="nm"></div><div class="nt"></div></div>
  </div>

  <div id="ctl">
    <label for="ex">Explode</label>
    <input type="range" id="ex" min="0" max="100" value="0">
    <span class="val" id="exv">0%</span>
  </div>

  <div id="panel">
    <div id="steps">
      <div class="no" id="sNo"></div>
      <h2 id="sTitle"></h2>
      <p id="sBody"></p>
      <div class="nav">
        <button id="sPrev">← Back</button>
        <button id="sNext">Next →</button>
        <span class="cnt" id="sCnt"></span>
      </div>
    </div>
    <div id="list"></div>
  </div>
</div>

"use strict";

function b64ToBytes(s){
  const bin = atob(s); const n = bin.length; const out = new Uint8Array(n);
  for (let i=0;i<n;i++) out[i] = bin.charCodeAt(i);
  return out;

document.getElementById("load").remove();

/* ---------- colours ---------- */
const hex = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255,
                  parseInt(h.slice(5,7),16)/255];
const parts = META.parts.map((p,i) => ({...p, idx:i, rgb:hex(p.color), on:true}));

/* ---------- gl setup ---------- */
let prog, pick, vao, vbo, uni={}, puni={};
const VS = `#version 300 es
in vec3 aQ;
uniform mat4 uMVP, uMV;
uniform vec3 uLo, uSpan, uExpl;
out vec3 vP;
void main(){
  vec3 p = (aQ*0.5+0.5)*uSpan + uLo + uExpl;
  vec4 mv = uMV * vec4(p,1.0);
  vP = mv.xyz;
  gl_Position = uMVP * vec4(p,1.0);
}`;
const FS = `#version 300 es
precision highp float;
in vec3 vP;
uniform vec3 uCol;
uniform float uDim, uAlpha;
out vec4 o;
void main(){
  // flat facet normal recovered from screen-space derivatives - crisp CAD edges
  vec3 n = normalize(cross(dFdx(vP), dFdy(vP)));
  vec3 L1 = normalize(vec3(0.42,0.55,0.72));
  vec3 L2 = normalize(vec3(-0.55,-0.25,0.35));
  float d = max(dot(n,L1),0.0)*0.78 + max(dot(n,L2),0.0)*0.26 + 0.30;
  vec3 c = uCol;
  float g = dot(c, vec3(0.299,0.587,0.114));
  c = mix(c, vec3(g*0.86+0.10), uDim);          // dim = drain colour, keep form
  float rim = pow(1.0 - abs(normalize(-vP).z), 3.0) * 0.22 * (1.0-uDim);
  o = vec4(c*d + rim, uAlpha);
}`;
const PFS = `#version 300 es
precision highp float;
uniform vec3 uCol;
out vec4 o;
void main(){ o = vec4(uCol,1.0); }`;

function sh(t,s){ const x=gl.createShader(t); gl.shaderSource(x,s); gl.compileShader(x);
  if(!gl.getShaderParameter(x,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; }
function link(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.bindAttribLocation(p,0,"aQ");
  gl.linkProgram(p); if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p; }

let fbo, ftex, frb;
if (gl) {
  prog = link(VS,FS); pick = link(VS,PFS);
  for (const k of ["uMVP","uMV","uLo","uSpan","uExpl","uCol","uDim","uAlpha"]) uni[k]=gl.getUniformLocation(prog,k);
  for (const k of ["uMVP","uMV","uLo","uSpan","uExpl","uCol"]) puni[k]=gl.getUniformLocation(pick,k);
  vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, bytes, gl.STATIC_DRAW);
  vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.SHORT, true, 6, 0);
  gl.enable(gl.DEPTH_TEST); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  fbo = gl.createFramebuffer(); ftex = gl.createTexture(); frb = gl.createRenderbuffer();
}

/* ---------- maths ---------- */
const M = {
  persp(f,a,n,fa){ const t=1/Math.tan(f/2); return [t/a,0,0,0, 0,t,0,0, 0,0,(fa+n)/(n-fa),-1, 0,0,2*fa*n/(n-fa),0]; },
  mul(a,b){ const o=new Array(16);
    for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+j]*b[i*4+k];o[i*4+j]=s;}
    return o; },
  look(e,c,u){ const z=nrm(sub(e,c)), x=nrm(cross(u,z)), y=cross(z,x);
    return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
            -dot(x,e),-dot(y,e),-dot(z,e),1]; }
};
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const nrm=a=>{const l=Math.hypot(...a)||1;return [a[0]/l,a[1]/l,a[2]/l];};

/* ---------- camera ---------- */
// Camera and explode scale come from the config so one template serves any
// assembly. centre/home/explodeScale are computed or supplied by build_viewer.py.
const CTR = META.centre || [0,0,0];
const EXK = META.explodeScale || 16;
const _bb = (()=> { let lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
  for (const p of META.parts) for (let i=0;i<3;i++){
    lo[i]=Math.min(lo[i],p.lo[i]); hi[i]=Math.max(hi[i],p.lo[i]+p.span[i]); }
  return Math.hypot(hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2])/2; })();
const HOME = Object.assign({yaw:-0.86, pitch:0.40, dist: Math.max(90, _bb*3.1)},
                           META.home || {});
let cam = {...HOME};
// In step mode, frame the parts you are actually fitting - at whole-assembly
// zoom a crank disc is 30 px wide and the instruction means nothing.
let focus = null;
function computeFocus(){
  if (!stepMode){ focus = null; return; }
  const act = parts.filter(p => p.step === step);
  if (!act.length){ focus = null; return; }
  const lo=[1e9,1e9,1e9], hi=[-1e9,-1e9,-1e9];
  for (const p of act) for (let i=0;i<3;i++){
    lo[i]=Math.min(lo[i], p.lo[i]); hi[i]=Math.max(hi[i], p.lo[i]+p.span[i]); }
  const r = Math.max(_bb*0.10, 0.5*Math.hypot(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]));
  focus = {c:[(lo[0]+hi[0])/2,(lo[1]+hi[1])/2,(lo[2]+hi[2])/2], d: r*3.4 + _bb*0.45};
}
function target(){ return focus ? focus.c : CTR; }
// pull the camera back as things fly apart, so an exploded view still frames
// Zoom is never clamped to the step's framing. Entering a step SNAPS the
// distance to fit those parts once (see renderStep) and then gets out of the
// way - clamping to the fit is what made stepping feel like being on rails.
const ZMIN = () => _bb*0.14, ZMAX = () => _bb*9;
function dist(){ return cam.dist * (1 + explode*0.42); }
function eye(){
  const cp=Math.cos(cam.pitch), d=dist(), t=target();
  return [t[0]+d*cp*Math.cos(cam.yaw), t[1]+d*cp*Math.sin(cam.yaw), t[2]+d*Math.sin(cam.pitch)];
}

/* ---------- state ---------- */
let explode = 0, labelsOn = true, ghostOn = true, isolate = false, multi = false;
const sel = new Set();        // selected part ids  (multi-select)
const hidden = new Set();     // explicitly hidden part ids
const byId = new Map(parts.map(p => [p.id, p]));
function selParts(){ return parts.filter(p => sel.has(p.id)); }
function lastSel(){ const a = selParts(); return a.length === 1 ? a[0] : null; }
let stepMode = false, step = 1;
// Three independent switches decide what you see, so any combination works:
//   stepMode  - parts not yet fitted are not in the model at all
//   hidden    - anything you switched off by hand, one part or fifty
//   isolate   - show ONLY the current selection
// A part suppressed by hidden/isolate can still render as a faint ghost, which
// keeps your bearings: a lone crank floating in space tells you nothing about
// where it sits, and re-showing the box to check costs two taps every time.
function state(p){
  if (stepMode && p.step > step) return "gone";
  if (hidden.has(p.id)) return ghostOn ? "ghost" : "gone";
  if (isolate && sel.size && !sel.has(p.id)) return ghostOn ? "ghost" : "gone";
  return "solid";
}
const visible = p => state(p) === "solid";
function dimOf(p){
  if (sel.size) return sel.has(p.id) ? 0.0 : 0.72;
  if (stepMode) return p.step === step ? 0.0 : 0.72;
  return 0.0;
}

/* ---------- draw ---------- */
function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  const w = Math.max(1,(r.width*dpr)|0), h = Math.max(1,(r.height*dpr)|0);
  if (cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; }
  return [w,h];
}
function stageBG(){
  const c = getComputedStyle(document.documentElement).getPropertyValue("--stage").trim();
  return c ? hex(c) : [0.05,0.06,0.06];
}
function draw(){
  if (!gl) return;
  const [w,h] = resize();
  gl.viewport(0,0,w,h);
  const bg = stageBG();
  gl.clearColor(bg[0],bg[1],bg[2],1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const V = M.look(eye(), target(), [0,0,1]);
  const P = M.persp(0.72, w/h, 1, 2000);
  const MVP = M.mul(P,V);
  gl.useProgram(prog); gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(uni.uMVP,false,new Float32Array(MVP));
  gl.uniformMatrix4fv(uni.uMV,false,new Float32Array(V));
  const put = p => {
    gl.uniform3fv(uni.uLo,new Float32Array(p.lo));
    gl.uniform3fv(uni.uSpan,new Float32Array(p.span));
    gl.uniform3fv(uni.uExpl,new Float32Array(p.explode.map(e=>e*explode*EXK)));
    gl.uniform3fv(uni.uCol,new Float32Array(p.rgb));
    gl.drawArrays(gl.TRIANGLES,p.off/6,p.n);
  };
  gl.uniform1f(uni.uAlpha, 1.0);
  for (const p of parts) if (state(p)==="solid"){ gl.uniform1f(uni.uDim,dimOf(p)); put(p); }
  // ghosts last, blended, depth-write off so they never occlude a real part
  const gh = parts.filter(p => state(p)==="ghost");
  if (gh.length){
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false); gl.disable(gl.CULL_FACE);
    gl.uniform1f(uni.uDim, 1.0); gl.uniform1f(uni.uAlpha, 0.13);
    for (const p of gh) put(p);
    gl.depthMask(true); gl.enable(gl.CULL_FACE); gl.disable(gl.BLEND);
    gl.uniform1f(uni.uAlpha, 1.0);
  }
  drawLabels(MVP, w, h);
}

const labelBox = document.getElementById("labels");
const leads = document.getElementById("leads");
const pins = new Map(), lns = new Map();

// Labels go into two callout columns, left and right, each sorted by height and
// pushed apart so nothing overlaps - then a leader line runs back to the part.
// Free-floating labels sitting on their own part is what made the last attempt
// unreadable: at 20-odd parts they pile on top of each other and hide the model.
function drawLabels(MVP, w, h){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const W = w/dpr, H = h/dpr;
  const show = labelsOn && (explode > 0.04 || stepMode || sel.size > 0 || isolate);
  const items = [];
  for (const p of parts){
    const vis = show && visible(p) &&
      (stepMode ? p.step === step
                : (explode > 0.04 || isolate || sel.has(p.id)));
    if (!vis) continue;
    const e = p.explode.map(v=>v*explode*EXK);
    const c = [p.lo[0]+p.span[0]/2+e[0], p.lo[1]+p.span[1]/2+e[1], p.lo[2]+p.span[2]/2+e[2]];
    const o=[0,0,0,0];
    for (let i=0;i<4;i++) o[i]=MVP[0*4+i]*c[0]+MVP[1*4+i]*c[1]+MVP[2*4+i]*c[2]+MVP[3*4+i];
    if (o[3] <= 0.001) continue;
    items.push({p, ax:(o[0]/o[3]*0.5+0.5)*W, ay:(1-(o[1]/o[3]*0.5+0.5))*H});
  }
  for (const [id,el] of pins) el.style.display = "none";
  for (const [id,el] of lns) el.style.display = "none";
  if (!items.length) return;

  const ROW = W < 620 ? 19 : 21, PAD = W < 620 ? 6 : 10;
  const cols = {L:[], R:[]};
  for (const it of items) (it.ax < W*0.5 ? cols.L : cols.R).push(it);
  for (const side of ["L","R"]){
    const col = cols[side].sort((a,b)=>a.ay-b.ay);
    const maxN = Math.max(1, Math.floor((H - 2*PAD)/ROW));
    if (col.length > maxN) col.length = maxN;
    let y = PAD;
    for (const it of col){ it.ly = Math.max(y, Math.min(it.ay, H-PAD-ROW)); y = it.ly + ROW; }
    // if we ran past the bottom, shift the whole stack up
    const over = y - (H - PAD);
    if (over > 0) for (const it of col) it.ly = Math.max(PAD, it.ly - over);
    for (const it of col){
      const p = it.p;
      let el = pins.get(p.id);
      if (!el){ el = document.createElement("div"); el.className="pin";
                el.textContent = p.label; labelBox.appendChild(el); pins.set(p.id, el); }
      let ln = lns.get(p.id);
      if (!ln){ ln = document.createElementNS("http://www.w3.org/2000/svg","line");
                leads.appendChild(ln); lns.set(p.id, ln); }
      const hi = sel.has(p.id) || (stepMode && p.step===step);
      el.className = "pin" + (side==="R" ? " r" : "") + (hi ? " hi" : "");
      el.style.display = "";
      el.style.borderLeftColor = side==="L" ? p.color : "";
      el.style.borderRightColor = side==="R" ? p.color : "";
      const lw = el.offsetWidth || 90;
      const lx = side==="L" ? PAD : W - PAD - lw;
      el.style.transform = `translate(${lx.toFixed(1)}px,${it.ly.toFixed(1)}px)`;
      const tipX = side==="L" ? lx + lw + 3 : lx - 3;
      ln.setAttribute("x1", tipX.toFixed(1));
      ln.setAttribute("y1", (it.ly + ROW/2 - 2).toFixed(1));
      ln.setAttribute("x2", it.ax.toFixed(1));
      ln.setAttribute("y2", it.ay.toFixed(1));
      ln.setAttribute("class", hi ? "hi" : "");
      ln.style.display = "";
    }
  }
}
function pickAt(px,py){
  if (!gl) return null;
  const [w,h] = [cv.width, cv.height];
  gl.bindTexture(gl.TEXTURE_2D,ftex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.bindRenderbuffer(gl.RENDERBUFFER,frb);
  gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT16,w,h);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,ftex,0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,frb);
  gl.viewport(0,0,w,h);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const V = M.look(eye(),target(),[0,0,1]);
  const MVP = M.mul(M.persp(0.72,w/h,1,2000),V);
  gl.useProgram(pick); gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(puni.uMVP,false,new Float32Array(MVP));
  gl.uniformMatrix4fv(puni.uMV,false,new Float32Array(V));
  for (const p of parts){
    if (!visible(p)) continue;
    const id = p.idx+1;
    gl.uniform3fv(puni.uLo,new Float32Array(p.lo));
    gl.uniform3fv(puni.uSpan,new Float32Array(p.span));
    gl.uniform3fv(puni.uExpl,new Float32Array(p.explode.map(e=>e*explode*EXK)));
    gl.uniform3fv(puni.uCol,new Float32Array([((id>>0)&255)/255,((id>>8)&255)/255,0]));
    gl.drawArrays(gl.TRIANGLES,p.off/6,p.n);
  }
  const px4 = new Uint8Array(4);
  gl.readPixels(px|0, (h-py)|0, 1,1, gl.RGBA, gl.UNSIGNED_BYTE, px4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const id = px4[0] | (px4[1]<<8);
  return id ? parts[id-1] : null;
}

/* ---------- interaction ---------- */
let drag=null, moved=0, pinch=null;
const pt = e => { const r=cv.getBoundingClientRect();
  const dpr=Math.min(devicePixelRatio||1,2);
  return [(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr]; };
cv.addEventListener("pointerdown", e=>{
  cv.setPointerCapture(e.pointerId);
  if (!drag){ drag={id:e.pointerId,x:e.clientX,y:e.clientY}; moved=0; }
  else { pinch={d:Math.hypot(e.clientX-drag.x,e.clientY-drag.y),dist:cam.dist}; }
});
cv.addEventListener("pointermove", e=>{
  if (pinch && e.pointerId!==drag.id){
    const d = Math.hypot(e.clientX-drag.x,e.clientY-drag.y);
    cam.dist = Math.min(ZMAX(),Math.max(ZMIN(), pinch.dist*pinch.d/Math.max(d,1)));
    draw(); return;
  }
  if (!drag || e.pointerId!==drag.id) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  moved += Math.abs(dx)+Math.abs(dy);
  cam.yaw -= dx*0.0085;
  cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy*0.0085));
  drag.x=e.clientX; drag.y=e.clientY; draw();
});
function up(e){
  if (drag && e.pointerId===drag.id){
    if (moved < 7 && !pinch){ const [x,y]=pt(e); pickPart(pickAt(x,y), e.shiftKey); }
    drag=null; pinch=null;
  } else pinch=null;
}
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel", e=>{ e.preventDefault();
  cam.dist = Math.min(ZMAX(),Math.max(ZMIN(), cam.dist*(1+Math.sign(e.deltaY)*0.11))); draw();
}, {passive:false});

/* ---------- ui ---------- */
const selNm=document.querySelector("#sel .nm"), selNt=document.querySelector("#sel .nt");
const statEl = document.getElementById("stat");

function pickPart(p, additive){
  if (!p){ if (!additive) sel.clear(); }
  else if (additive || multi){ sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id); }
  else { const only = sel.size===1 && sel.has(p.id); sel.clear(); if (!only) sel.add(p.id); }
  syncUI();
}
function syncUI(){
  const n = sel.size, one = lastSel();
  selNm.textContent = one ? one.label : (n ? n + " parts selected" : "");
  selNt.textContent = one ? one.note : "";
  selNt.style.display = (one && one.note) ? "" : "none";
  for (const r of document.querySelectorAll(".row")){
    r.setAttribute("aria-selected", String(sel.has(r.dataset.id)));
    r.classList.toggle("hid", hidden.has(r.dataset.id));
    const e = r.querySelector(".eyeb");
    if (e){ e.setAttribute("aria-pressed", String(hidden.has(r.dataset.id)));
            e.textContent = hidden.has(r.dataset.id) ? "hidden" : "hide"; }
  }
  bIso.setAttribute("aria-pressed", String(isolate));
  const bits = [];
  if (n) bits.push(n + " selected");
  if (hidden.size) bits.push(hidden.size + " hidden");
  if (isolate) bits.push("isolated");
  statEl.textContent = bits.join(" · ");
  draw();
}
function setHidden(ids, on){
  for (const id of ids) on ? hidden.add(id) : hidden.delete(id);
  syncUI();
}

const list = document.getElementById("list");
for (const [g,gname] of Object.entries(META.groups)){
  const mem = parts.filter(p=>p.group===g);
  if (!mem.length) continue;
  const h=document.createElement("div"); h.className="grp";
  const t=document.createElement("span"); t.textContent=gname; h.appendChild(t);
  const gb=document.createElement("button"); gb.className="gb"; gb.textContent="hide group";
  gb.addEventListener("click", ()=>{
    const ids = mem.map(p=>p.id), allHid = ids.every(i=>hidden.has(i));
    setHidden(ids, !allHid);
    gb.textContent = allHid ? "hide group" : "show group";
  });
  h.appendChild(gb); list.appendChild(h);

  for (const p of mem){
    const r=document.createElement("div");
    r.className="row"; r.dataset.id=p.id; r.tabIndex=0; r.setAttribute("role","button");
    r.innerHTML = `<span class="sw" style="background:${p.color}"></span>`+
                  `<span class="lb"></span><span class="st">step ${p.step}</span>`+
                  `<button class="eyeb" aria-pressed="false">hide</button>`;
    r.querySelector(".lb").textContent = p.label;
    r.querySelector(".eyeb").addEventListener("click", ev=>{
      ev.stopPropagation(); setHidden([p.id], !hidden.has(p.id)); });
    r.addEventListener("click", ev=> pickPart(p, ev.shiftKey||ev.metaKey||ev.ctrlKey));
    r.addEventListener("keydown", ev=>{ if(ev.key==="Enter"||ev.key===" "){
      ev.preventDefault(); pickPart(p, ev.shiftKey); } });
    list.appendChild(r);
  }
}

const ex=document.getElementById("ex"), exv=document.getElementById("exv");
ex.addEventListener("input", ()=>{ explode = +ex.value/100; exv.textContent = ex.value+"%"; draw(); });

const bIso=document.getElementById("bIso"), bLab=document.getElementById("bLab"),
      bGhost=document.getElementById("bGhost"), bMulti=document.getElementById("bMulti"),
      bHide=document.getElementById("bHide"), bShowAll=document.getElementById("bShowAll");

bLab.addEventListener("click", ()=>{ labelsOn=!labelsOn;
  bLab.setAttribute("aria-pressed",String(labelsOn)); draw(); });
bGhost.addEventListener("click", ()=>{ ghostOn=!ghostOn;
  bGhost.setAttribute("aria-pressed",String(ghostOn)); draw(); });
bMulti.addEventListener("click", ()=>{ multi=!multi;
  bMulti.setAttribute("aria-pressed",String(multi));
  bMulti.textContent = multi ? "Multi ✓" : "Multi +"; });

// Isolate = show ONLY what is selected. Hide = drop the selection out of view.
// Between them you can arrive at any subset either way round: keep three parts,
// or throw away the fifteen you do not care about.
bIso.addEventListener("click", ()=>{
  if (!sel.size){ selNm.textContent="Select a part first — tap it, or tap it in the list";
                  selNt.style.display="none"; return; }
  isolate=!isolate; syncUI(); });
bHide.addEventListener("click", ()=>{
  if (!sel.size){ selNm.textContent="Select what you want gone first";
                  selNt.style.display="none"; return; }
  const ids=[...sel]; sel.clear(); setHidden(ids, true); });
bShowAll.addEventListener("click", ()=>{
  hidden.clear(); sel.clear(); isolate=false; syncUI(); });
document.getElementById("bReset").addEventListener("click", ()=>{
  cam={...HOME}; ex.value=0; explode=0; exv.textContent="0%";
  hidden.clear(); sel.clear(); isolate=false; focus=null;
  if (stepMode) renderStep(); else syncUI(); });

addEventListener("keydown", e=>{
  if (e.target.tagName==="INPUT") return;
  if (e.key==="Escape"){ sel.clear(); isolate=false; syncUI(); }
  else if (stepMode && e.key==="ArrowRight"){ step=Math.min(S.length,step+1); renderStep(); }
  else if (stepMode && e.key==="ArrowLeft"){ step=Math.max(1,step-1); renderStep(); }
  else if (e.key==="h" && sel.size){ const ids=[...sel]; sel.clear(); setHidden(ids,true); }
  else if (e.key==="i" && sel.size){ isolate=!isolate; syncUI(); }
});

/* ---------- steps ---------- */
const S=(META.steps && META.steps.length) ? META.steps : [[1,"Assembly","No steps defined for this assembly."]], sNo=document.getElementById("sNo"), sTi=document.getElementById("sTitle"),
      sBo=document.getElementById("sBody"), sCnt=document.getElementById("sCnt");
function renderStep(){
  const s = S.find(x=>x[0]===step) || S[0];
  sNo.textContent = "Step " + String(s[0]).padStart(2,"0");
  sTi.textContent = s[1]; sBo.textContent = s[2];
  sCnt.textContent = step + " / " + S.length;
  computeFocus();
  document.getElementById("sPrev").disabled = step<=1;
  document.getElementById("sNext").disabled = step>=S.length;
  // snap the camera to frame this step's parts ONCE, then leave zoom alone
  if (focus) cam.dist = focus.d;
  sel.clear(); isolate=false;
  const now = parts.filter(p=>p.step===step);
  selNm.textContent = now.map(p=>p.label).join(", ");
  selNt.textContent = now.length===1 ? now[0].note : "";
  selNt.style.display = (now.length===1 && now[0].note) ? "" : "none";
  syncUI();
}
document.getElementById("sPrev").addEventListener("click",()=>{ step=Math.max(1,step-1); renderStep(); });
document.getElementById("sNext").addEventListener("click",()=>{ step=Math.min(S.length,step+1); renderStep(); });
const mFree=document.getElementById("mFree"), mStep=document.getElementById("mStep");
function setMode(sm){
  stepMode=sm; step = sm?1:step; sel.clear(); isolate=false; hidden.clear();
  mFree.setAttribute("aria-pressed",String(!sm)); mStep.setAttribute("aria-pressed",String(sm));
  document.getElementById("steps").classList.toggle("on",sm);
  list.classList.toggle("off",sm);
  if (sm) renderStep(); else { focus=null; cam.dist=HOME.dist; syncUI(); }
}
mFree.addEventListener("click",()=>setMode(false));
mStep.addEventListener("click",()=>setMode(true));

function syncSvg(){ const r=cv.getBoundingClientRect();
  leads.setAttribute("viewBox",`0 0 ${r.width} ${r.height}`);
  leads.setAttribute("width",r.width); leads.setAttribute("height",r.height); }
if (!(META.steps && META.steps.length)) document.getElementById("modeSeg").style.display="none";
addEventListener("resize", ()=>{ syncSvg(); draw(); });
syncSvg();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
selNt.style.display="none";
syncUI();
})();
</script>
