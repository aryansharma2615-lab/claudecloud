; FarmHand motion controller — ESP32-S3 DevKitC-1 N16R8
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1
monitor_speed = 115200
lib_deps =
  gin66/FastAccelStepper @ ^0.31
  bblanchon/ArduinoJson @ ^7
  adafruit/Adafruit MCP23017 Arduino Library @ ^2
  adafruit/Adafruit ADS1X15 @ ^2
  bogde/HX711 @ ^0.7
  teemuatlut/TMCStepper @ ^0.7
