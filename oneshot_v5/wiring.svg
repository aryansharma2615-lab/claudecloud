<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold">OneShot Arm v5 — wiring (UNO drives motors, ESP32-CAM = camera + Wi-Fi)</text>
  <text x="20" y="50" fill="#555">Red = 5 V motor rail (through E-stop) · Orange = 5 V logic (always on) · Black = GND (all joined) · Yellow = servo/stepper signals · Blue = serial</text>

  <!-- PSU -->
  <rect x="20" y="80" width="150" height="70" rx="6" fill="#f3f3f3" stroke="#333"/>
  <text x="32" y="105" font-weight="bold">5 V 4 A supply</text><text x="32" y="125">+5V  ·  GND</text><text x="32" y="142" fill="#555">wall adapter</text>

  <!-- E-stop -->
  <rect x="230" y="80" width="130" height="70" rx="6" fill="#ffe9e6" stroke="#c0392b"/>
  <text x="242" y="105" font-weight="bold" fill="#c0392b">E-stop (NC)</text><text x="242" y="125">in series with the</text><text x="242" y="142">motor rail only</text>

  <!-- cap -->
  <rect x="410" y="85" width="110" height="60" rx="6" fill="#fff8e1" stroke="#b7950b"/>
  <text x="420" y="108" font-weight="bold">1000 µF cap</text><text x="420" y="128">+ to rail, − to GND</text>

  <!-- rail lines -->
  <line x1="170" y1="100" x2="230" y2="100" stroke="#e74c3c" stroke-width="4"/>
  <line x1="360" y1="100" x2="410" y2="100" stroke="#e74c3c" stroke-width="4"/>
  <line x1="520" y1="100" x2="960" y2="100" stroke="#e74c3c" stroke-width="4"/>
  <text x="600" y="92" fill="#c0392b" font-weight="bold">MOTOR RAIL 5 V (dead when E-stop pressed)</text>
  <line x1="95" y1="150" x2="95" y2="640" stroke="#f39c12" stroke-width="4"/>
  <text x="102" y="200" fill="#d35400" font-weight="bold" transform="rotate(90 102 200)">LOGIC 5 V (always on)</text>
  <line x1="40" y1="150" x2="40" y2="660" stroke="#111" stroke-width="4"/>
  <line x1="40" y1="660" x2="960" y2="660" stroke="#111" stroke-width="4"/>
  <text x="300" y="675" font-weight="bold">COMMON GND — every black wire meets here (PSU −, UNO, ESP, servos, ULN2003)</text>

  <!-- Servos -->
  <g>
    <rect x="600" y="140" width="360" height="150" rx="6" fill="#eef6ff" stroke="#2c6fbb"/>
    <text x="612" y="162" font-weight="bold">3 × SG90 servos (brown GND · red +5V · orange signal)</text>
    <text x="612" y="190">Shoulder  → signal UNO D5</text>
    <text x="612" y="212">Elbow     → signal UNO D6</text>
    <text x="612" y="234">Gripper   → signal UNO D3</text>
    <text x="612" y="262" fill="#555">red wires to MOTOR RAIL, never to the UNO 5V pin</text>
    <text x="612" y="280" fill="#555">(3 stalled SG90s ≈ 2 A; the UNO pin gives ~0.5 A)</text>
    <line x1="780" y1="100" x2="780" y2="140" stroke="#e74c3c" stroke-width="3"/>
  </g>

  <!-- ULN2003 -->
  <g>
    <rect x="600" y="320" width="360" height="120" rx="6" fill="#eef6ff" stroke="#2c6fbb"/>
    <text x="612" y="342" font-weight="bold">ULN2003 board + 28BYJ-48 (yaw)</text>
    <text x="612" y="368">IN1 → D8 · IN2 → D9 · IN3 → D10 · IN4 → D11</text>
    <text x="612" y="392">+ → MOTOR RAIL · − → GND</text>
    <text x="612" y="416">motor plugs into the white 5-pin socket</text>
    <line x1="940" y1="100" x2="940" y2="320" stroke="#e74c3c" stroke-width="3"/>
  </g>

  <!-- UNO -->
  <g>
    <rect x="300" y="220" width="250" height="300" rx="8" fill="#e8f8f0" stroke="#1e8449" stroke-width="2"/>
    <text x="315" y="245" font-weight="bold" font-size="15">Arduino UNO R3</text>
    <text x="315" y="270">D5, D6, D3 → servo signals</text>
    <text x="315" y="292">D8–D11 → ULN2003 IN1–IN4</text>
    <text x="315" y="314">A0 ← rail sense (10k from rail,</text>
    <text x="330" y="332">100k from A0 to GND)</text>
    <text x="315" y="354">D2 ← door button / jumper to GND</text>
    <text x="315" y="380" fill="#1f618d" font-weight="bold">D0 (RX) ← ESP GPIO14</text>
    <text x="315" y="402" fill="#1f618d" font-weight="bold">D1 (TX) → 1k → ESP GPIO15</text>
    <text x="330" y="420" fill="#1f618d">GPIO15 → 2k → GND</text>
    <text x="315" y="446">USB → Mac (power + uploads)</text>
    <text x="315" y="468">GND → COMMON GND</text>
    <text x="315" y="495" fill="#c0392b">Unplug the D0 wire while uploading</text>
    <line x1="550" y1="275" x2="600" y2="210" stroke="#d4ac0d" stroke-width="3"/>
    <line x1="550" y1="295" x2="600" y2="368" stroke="#d4ac0d" stroke-width="3"/>
    <line x1="550" y1="318" x2="575" y2="318" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4 3"/>
    <line x1="575" y1="318" x2="575" y2="100" stroke="#e74c3c" stroke-width="2" stroke-dasharray="4 3"/>
  </g>

  <!-- ESP32-CAM -->
  <g>
    <rect x="130" y="380" width="150" height="200" rx="8" fill="#fdf2e9" stroke="#ca6f1e" stroke-width="2"/>
    <text x="142" y="405" font-weight="bold" font-size="15">ESP32-CAM</text>
    <text x="142" y="425" fill="#555">(AI-Thinker, off the MB)</text>
    <text x="142" y="450">5V ← LOGIC 5 V</text>
    <text x="142" y="470">GND → COMMON</text>
    <text x="142" y="495" fill="#1f618d" font-weight="bold">GPIO14 = TX</text>
    <text x="142" y="515" fill="#1f618d" font-weight="bold">GPIO15 = RX</text>
    <text x="142" y="540">camera ribbon</text>
    <text x="142" y="560">Wi-Fi → your router</text>
    <line x1="95" y1="450" x2="130" y2="450" stroke="#f39c12" stroke-width="3"/>
    <line x1="280" y1="490" x2="300" y2="378" stroke="#2e86c1" stroke-width="3"/>
    <line x1="280" y1="512" x2="300" y2="400" stroke="#2e86c1" stroke-width="3"/>
  </g>
  <line x1="95" y1="150" x2="95" y2="160" stroke="#f39c12" stroke-width="4"/>
  <text x="20" y="175" fill="#d35400">PSU + also feeds the logic line BEFORE the E-stop</text>

  <!-- Mac -->
  <rect x="600" y="470" width="360" height="110" rx="6" fill="#f4f6f7" stroke="#566573"/>
  <text x="612" y="494" font-weight="bold">Mac (Claude via MCP)</text>
  <text x="612" y="518">Wi-Fi → http://oneshot.local (photos + commands)</text>
  <text x="612" y="540">USB → UNO (uploads, optional direct control)</text>
  <text x="612" y="562" fill="#555">Claude: look → move → grip → look again</text>
</svg>
